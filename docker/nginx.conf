server {
  listen 80;
  root /usr/share/nginx/html;

  # Sem hash no nome: nunca em cache, para o shell sempre ver a versão atual dos remotes
  location = /mf.manifest.json { add_header Cache-Control "no-cache"; }
  location ~ /remoteEntry\.js$ { add_header Cache-Control "no-cache"; }

  # Arquivos com hash: cache longo
  location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /remotes/ { try_files $uri =404; }

  # SPA: qualquer rota do shell devolve o index.html
  location / { try_files $uri $uri/ /index.html; }
}
