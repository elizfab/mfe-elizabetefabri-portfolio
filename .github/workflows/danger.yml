# Danger em eventos do PR que não vêm de push em feature/* (esses rodam no auto-pr.yml):
# PR aberto manualmente, título/descrição editados, PR reaberto ou marcado como pronto.
name: Danger

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    name: Danger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx danger ci --failOnErrors
        env:
          GITHUB_TOKEN: ${{ github.token }}
